[project]
name = "codebase-voice-assistant"
version = "0.1.0"
description = "Claude Code plugin — voice AI that joins dev calls and answers codebase questions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Artem Ustimenko" }
]
keywords = ["claude-code", "voice", "standup", "codebase", "mcp"]

dependencies = [
    "mcp>=1.0.0",
    "deepgram-sdk>=3.0.0",
    "livekit>=1.0.0",
    "livekit-api>=1.0.0",
    "twilio>=9.0.0",
    "pyaudio>=0.2.14",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
